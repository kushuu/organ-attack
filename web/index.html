<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"
        />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta name="theme-color" content="#0f0f1a" />
        <title>Organ Attack</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <!-- HOME SCREEN -->
        <div id="view-home" class="view active">
            <div class="home-container">
                <div class="logo">
                    <h1>ORGAN<span>ATTACK</span></h1>
                    <p class="tagline">Long distance friendships made me make this</p>
                </div>
                <div class="home-form">
                    <input
                        type="text"
                        id="player-name"
                        placeholder="Your name (make it creative)"
                        maxlength="20"
                        autocomplete="off"
                    />
                    <input
                        type="text"
                        id="server-url"
                        placeholder="the-backend-server (get the url from kushagra)"
                        value=""
                    />
                    <div class="home-buttons">
                        <button id="btn-host" class="btn btn-primary">
                            Host Game
                        </button>
                        <button id="btn-join-show" class="btn btn-secondary">
                            Join Game
                        </button>
                    </div>
                    <div id="join-form" class="join-form hidden">
                        <input
                            type="text"
                            id="game-code"
                            placeholder="Game Code"
                            maxlength="6"
                            autocomplete="off"
                            style="text-transform: uppercase"
                        />
                        <button id="btn-join" class="btn btn-accent">
                            Join
                        </button>
                    </div>
                </div>
                <div id="home-status" class="status-bar"></div>
            </div>
        </div>

        <!-- LOBBY SCREEN -->
        <div id="view-lobby" class="view">
            <div class="lobby-container">
                <h2>Game Lobby</h2>
                <div class="lobby-code-box">
                    <span class="lobby-code-label">Game Code</span>
                    <span id="lobby-code" class="lobby-code">------</span>
                    <button
                        id="btn-copy-code"
                        class="btn-icon"
                        title="Copy code"
                    >
                        &#128203;
                    </button>
                </div>
                <div class="lobby-players">
                    <h3>Players</h3>
                    <ul id="player-list"></ul>
                </div>
                <div class="lobby-actions">
                    <button id="btn-start-game" class="btn btn-primary hidden">
                        Start Game
                    </button>
                    <button id="btn-leave-lobby" class="btn btn-danger">
                        Leave
                    </button>
                </div>
            </div>
        </div>

        <!-- GAME SCREEN -->
        <div id="view-game" class="view">
            <div class="game-layout">
                <!-- Top bar -->
                <div class="game-header">
                    <div class="game-info">
                        <span id="turn-info" class="turn-badge">Turn: --</span>
                        <span id="phase-info" class="phase-badge">PLAY</span>
                    </div>
                    <div class="deck-info">
                        <span id="deck-count">Deck: 0</span>
                        <span id="discard-count">Discard: 0</span>
                    </div>
                    <button
                        id="btn-leave-game"
                        class="btn btn-small btn-danger"
                    >
                        Leave
                    </button>
                </div>

                <!-- Opponents area -->
                <div id="opponents-area" class="opponents-area"></div>

                <!-- Game message -->
                <div id="game-message" class="game-message hidden"></div>

                <!-- My area -->
                <div class="my-area">
                    <div class="my-organs-section">
                        <h3>My Organs</h3>
                        <div id="my-organs" class="organs-grid"></div>
                    </div>
                    <div class="my-hand-section">
                        <h3>My Hand</h3>
                        <div id="my-hand" class="hand-grid"></div>
                    </div>
                </div>

                <!-- Controls -->
                <div class="game-controls">
                    <button id="btn-draw" class="btn btn-primary">
                        Draw Card
                    </button>
                    <button id="btn-discard" class="btn btn-warning">
                        Discard Card
                    </button>
                    <button id="btn-end-turn" class="btn btn-secondary">
                        End Turn
                    </button>
                </div>
            </div>
        </div>

        <!-- TARGET MODAL -->
        <div id="target-modal" class="modal hidden">
            <div class="modal-content">
                <h3 id="modal-title">Select Target</h3>
                <p id="modal-desc"></p>
                <div id="modal-players" class="modal-players"></div>
                <div id="modal-organs" class="modal-organs hidden">
                    <h4>Select Organ</h4>
                    <div id="modal-organ-list" class="organ-list"></div>
                </div>
                <div class="modal-actions">
                    <button id="modal-discard" class="btn btn-warning hidden">
                        Discard Instead
                    </button>
                    <button id="modal-ok" class="btn btn-primary">
                        Confirm
                    </button>
                    <button id="modal-cancel" class="btn btn-danger">
                        Cancel
                    </button>
                </div>
            </div>
        </div>

        <!-- TOAST -->
        <div id="toast" class="toast hidden"></div>

        <!-- GAME OVER MODAL -->
        <div id="game-over-modal" class="modal hidden">
            <div class="modal-content game-over-content">
                <div id="confetti-container"></div>
                <div class="game-over-inner">
                    <div class="game-over-trophy">&#127942;</div>
                    <h2 id="game-over-title" class="game-over-title">
                        Game Over!
                    </h2>
                    <p id="game-over-message" class="game-over-message"></p>
                    <p id="game-over-subtitle" class="game-over-subtitle"></p>
                    <button id="btn-play-again" class="btn btn-primary">
                        Play Again
                    </button>
                </div>
            </div>
        </div>

        <script type="module" src="js/app.js"></script>
    </body>
</html>
